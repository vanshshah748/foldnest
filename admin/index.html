<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldNest Admin - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h2>FoldNest <span>Admin</span></h2>
                <p>Secure Enterprise Portal</p>
            </div>
            
            <form id="admin-login-form">
                <div id="login-error" class="error-msg" style="display: none;"></div>
                
                <div class="input-group">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter admin email">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter secure password">
                </div>
                
                <div class="actions">
                    <label class="remember">
                        <input type="checkbox" id="remember"> Remember Me
                    </label>
                    <a href="#" class="forgot-pwd">Forgot Password?</a>
                </div>
                
                <button type="submit" id="login-btn" class="btn">Secure Login</button>
            </form>
            <div class="footer">
                &copy; 2026 FoldNest Furniture Admin Panel
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
