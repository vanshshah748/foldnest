<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoldNest Furniture - My Addresses</title>
  <meta name="description" content="Manage your saved shipping addresses for faster checkout on FoldNest Furniture.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/addresses.css">
  <style>
    .header-icon { display: inline-flex; align-items: center; vertical-align: middle; margin-right: 8px; }
    .type-btn { display: inline-flex; align-items: center; gap: 6px; }
    .type-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='../index.html'">FoldNest</div>
      <input type="text" id="searchBar" placeholder="Search furniture..." onkeyup="searchProducts()">
      <ul class="nav-links">
        <li><button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode" aria-label="Toggle theme"></button></li>
        <li><a href="../index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="order_history.html">Orders</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="profile.html" id="authLink" style="display:inline-flex;align-items:center;gap:5px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Profile
        </a></li>
      </ul>
    </nav>
  </header>

  <!-- ADDRESSES SECTION -->
  <section id="addresses-section" class="active">
    <div class="addresses-container">
      <!-- Page Header -->
      <div class="page-header">
        <h1>
          <span class="header-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
          My Addresses
        </h1>
        <button class="btn add-address-btn" onclick="showAddressForm()">
          <span style="font-weight:bold;margin-right:5px;">+</span> Add New Address
        </button>
      </div>

      <!-- Address Form (Hidden by default) -->
      <div id="addressFormWrapper" class="address-form-wrapper" style="display:none;">
        <div class="address-form-card">
          <div class="form-header">
            <h2 id="formTitle">Add New Address</h2>
            <button class="close-form-btn" onclick="hideAddressForm()">&times;</button>
          </div>
          <form id="addressForm" onsubmit="return false;">
            <input type="hidden" id="editAddressId" value="">
            
            <div class="form-grid">
              <div class="input-group">
                <label for="addr_full_name">Full Name *</label>
                <input type="text" id="addr_full_name" placeholder="Enter full name" required>
              </div>
              <div class="input-group">
                <label for="addr_mobile">Mobile Number *</label>
                <input type="text" id="addr_mobile" placeholder="10-digit mobile number" maxlength="10" required>
                <small class="field-hint">Must start with 6-9</small>
              </div>
              <div class="input-group">
                <label for="addr_alt_mobile">Alternate Mobile</label>
                <input type="text" id="addr_alt_mobile" placeholder="Optional alternate number" maxlength="10">
              </div>
              <div class="input-group full-width">
                <label for="addr_line1">Address Line 1 *</label>
                <input type="text" id="addr_line1" placeholder="House/Flat No., Building, Street" required>
              </div>
              <div class="input-group full-width">
                <label for="addr_line2">Address Line 2</label>
                <input type="text" id="addr_line2" placeholder="Area, Colony (Optional)">
              </div>
              <div class="input-group">
                <label for="addr_landmark">Landmark</label>
                <input type="text" id="addr_landmark" placeholder="Nearby landmark">
              </div>
              <div class="input-group">
                <label for="addr_city">City *</label>
                <input type="text" id="addr_city" placeholder="Enter city" required>
              </div>
              <div class="input-group">
                <label for="addr_state">State *</label>
                <select id="addr_state" required>
                  <option value="">Select State</option>
                  <option>Andhra Pradesh</option><option>Arunachal Pradesh</option>
                  <option>Assam</option><option>Bihar</option><option>Chhattisgarh</option>
                  <option>Goa</option><option>Gujarat</option><option>Haryana</option>
                  <option>Himachal Pradesh</option><option>Jharkhand</option><option>Karnataka</option>
                  <option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option>
                  <option>Manipur</option><option>Meghalaya</option><option>Mizoram</option>
                  <option>Nagaland</option><option>Odisha</option><option>Punjab</option>
                  <option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option>
                  <option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option>
                  <option>Uttarakhand</option><option>West Bengal</option>
                  <option>Delhi</option><option>Chandigarh</option><option>Jammu & Kashmir</option>
                  <option>Ladakh</option>
                </select>
              </div>
              <div class="input-group">
                <label for="addr_pincode">Pincode *</label>
                <input type="text" id="addr_pincode" placeholder="6-digit pincode" maxlength="6" required>
              </div>
              <div class="input-group">
                <label for="addr_type">Address Type</label>
                <div class="address-type-toggle">
                  <button type="button" class="type-btn active" data-type="Home" onclick="selectAddressType(this)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Home
                  </button>
                  <button type="button" class="type-btn" data-type="Office" onclick="selectAddressType(this)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    Office
                  </button>
                </div>
              </div>
              <div class="input-group" style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                <input type="checkbox" id="addr_default" style="width:auto;">
                <label for="addr_default" style="margin:0; cursor:pointer;">Set as default address</label>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="hideAddressForm()">Cancel</button>
              <button type="button" class="btn" onclick="saveAddress()">Save Address</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Address List -->
      <div id="addressList" class="address-list">
        <!-- Addresses will be loaded here dynamically -->
        <div class="loading-spinner" id="addressLoading">
          <div class="spinner"></div>
          <p>Loading your addresses...</p>
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-color);"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        </div>
        <h3>No Saved Addresses</h3>
        <p>Add a shipping address to make checkout faster!</p>
        <button class="btn" onclick="showAddressForm()">Add Your First Address</button>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <h3>FoldNest Furniture</h3>
    <p>Smart Furniture For Smart Homes &copy; 2026</p>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/addresses.js"></script>

</body>
</html>
