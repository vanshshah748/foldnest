<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoldNest Furniture - Cart & Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/products.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='../index.html'">FoldNest</div>
      <input type="text" id="searchBar" placeholder="Search furniture..." onkeyup="searchProducts()">
      <ul class="nav-links">
        <li><button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode" aria-label="Toggle theme"></button></li>
        <li><a href="../index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="order_history.html">Orders</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="profile.html" id="authLink" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Profile</a></li>
      </ul>
    </nav>
  </header>

  <!-- CART -->
  <section id="cart" class="active">
    <div class="cart-container">
      <h2>Your Shopping Cart</h2>
      <div id="cartItems"></div>
      <h3 style="margin-top:20px; font-size:1.5rem;">Total: &#8377;<span id="total">0</span></h3>
      <br>
      <button class="btn" style="width:100%; font-size:1.1rem; padding:15px;" onclick="window.location.href='checkout.html'">Proceed To Checkout</button>
    </div>
  </section>

  <!-- RECOMMENDATIONS -->
  <section id="recommendations-wrapper" class="active" style="margin-top: 60px; padding: 0 5%; display: none;">
    <h2 style="text-align: center; margin-bottom: 30px; font-size: 2rem;" id="recommendations-title">Frequently Bought Together</h2>
    <div id="recommendations-container" class="products">
      <!-- Recommendations injected here -->
    </div>
  </section>

  <!-- NEWSLETTER -->
  <section class="newsletter active">
    <h2>Subscribe to our Newsletter</h2>
    <p>Get the latest updates on new products and upcoming sales.</p>
    <div class="newsletter-form">
      <input type="email" placeholder="Enter your email address">
      <button class="btn" onclick="showToast('Subscribed Successfully!')">Subscribe</button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <h3>FoldNest Furniture</h3>
    <p>Smart Furniture For Smart Homes &copy; 2026</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/animations.js"></script>

</body>
</html>
