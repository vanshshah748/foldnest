<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoldNest Furniture - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='../index.html'">FoldNest</div>
      <input type="text" id="searchBar" placeholder="Search furniture..." onkeyup="searchProducts()">
      <ul class="nav-links">
        <li><button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode" aria-label="Toggle theme"></button></li>
        <li><a href="../index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="order_history.html">Orders</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="profile.html" id="authLink" style="display:inline-flex;align-items:center;gap:5px;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Profile</a></li>
      </ul>
    </nav>
  </header>

  <!-- REGISTER -->
  <section id="register" class="active">
    <div class="form-container">
      <h2>Create an Account</h2>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Enter your full name">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Create a password">
      </div>
      <button class="btn" style="width:100%" onclick="registerUser()">Register</button>
      <p style="margin-top: 15px; text-align: center; color: #a0aec0; font-size: 0.9rem;">
        Already have an account? <a href="login.html" style="color: var(--primary-color);">Login here</a>
      </p>
      <p id="registerMessage" class="success"></p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <h3>FoldNest Furniture</h3>
    <p>Smart Furniture For Smart Homes © 2026</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>

</body>
</html>
