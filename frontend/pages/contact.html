<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoldNest Furniture - Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/products.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='../index.html'">FoldNest</div>
      <input type="text" id="searchBar" placeholder="Search furniture..." onkeyup="searchProducts()">
      <ul class="nav-links">
        <li><button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode"
            aria-label="Toggle theme"></button></li>
        <li><a href="../index.html">Home </a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="order_history.html">Orders</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="profile.html" id="authLink" style="display:inline-flex;align-items:center;gap:5px;"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg> Profile</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTACT -->
  <section id="contact" class="active">
    <div class="form-container">
      <h2>Contact Us</h2>
      <div class="input-group">
        <label>Name</label>
        <input type="text" id="contact-name" placeholder="Enter your name" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="contact-email" placeholder="Enter your email" required>
      </div>
      <div class="input-group">
        <label>Phone</label>
        <input type="tel" id="contact-phone" placeholder="Enter your phone number">
      </div>
      <div class="input-group">
        <label>Subject</label>
        <input type="text" id="contact-subject" placeholder="What is this regarding?" required>
      </div>
      <div class="input-group">
        <label>Message</label>
        <textarea id="contact-message" placeholder="How can we help you?" rows="4"
          style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit;"
          required></textarea>
      </div>
      <button class="btn" id="contact-submit-btn" style="width:100%" onclick="submitContactQuery()">Send
        Message</button>
    </div>
  </section>

  <!-- NEWSLETTER -->
  <section class="newsletter active">
    <h2>Subscribe to our Newsletter</h2>
    <p>Get the latest updates on new products and upcoming sales.</p>
    <div class="newsletter-form">
      <input type="email" placeholder="Enter your email address">
      <button class="btn" onclick="showToast('Subscribed Successfully!')">Subscribe</button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <h3>FoldNest Furniture</h3>
    <p>Smart Furniture For Smart Homes © 2026</p>
  </footer>

  <!-- MODAL -->
  <div id="productModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage">
    <div id="caption"></div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/contact_submit.js"></script>

</body>

</html>
